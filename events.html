<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0D1210">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PIBASE">
<title>APPLEMDT — Events</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/pibase-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/pibase-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 80px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.top h1{font-family:var(--font-display);font-size:1.3rem;margin:0}.back{color:var(--text-muted);text-decoration:none;font-size:.85rem}.add{width:100%;background:var(--surface);border:1px dashed var(--line-bright);color:var(--text-muted);border-radius:var(--radius);padding:14px;font-size:.9rem;margin-bottom:14px}.event-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer}.event-card.synced{border-left:3px solid var(--teal);cursor:pointer}.event-action{font-family:var(--font-mono);font-size:.62rem;color:var(--teal);margin-top:8px;letter-spacing:.04em;text-transform:uppercase}.mode-note{background:var(--bg-raised);border:1px solid var(--line-bright);border-radius:var(--radius);padding:10px 12px;font-family:var(--font-mono);font-size:.66rem;color:var(--text-muted);margin-bottom:6px}input:read-only{background:var(--bg);color:var(--text-muted)}.event-row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.event-name{font-family:var(--font-display);font-size:1.05rem}.event-type{font-family:var(--font-mono);font-size:.62rem;color:var(--brass);text-transform:uppercase;letter-spacing:.06em;text-align:right;white-space:nowrap}.event-meta{font-size:.76rem;color:var(--text-dim);margin-top:4px;line-height:1.4}.event-source{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 9px;font-family:var(--font-mono);font-size:.66rem;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase}.event-source:first-child{margin-top:4px}.event-source span{font-size:.58rem;color:var(--text-dim);letter-spacing:.04em}.source-message{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--text-dim);font-family:var(--font-mono);font-size:.7rem}.results{display:flex;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-family:var(--font-mono);font-size:.64rem;color:var(--text-muted)}.hidden{display:none!important}label{display:block;font-size:.78rem;color:var(--text-muted);margin:14px 0 5px}input,select,textarea{width:100%;background:var(--bg-raised);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:10px 11px;font-size:.95rem}textarea{resize:vertical;min-height:70px}.field-row{display:flex;gap:10px}.field-row>div{flex:1;min-width:0}.section-title{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:24px 0 8px;padding-top:14px;border-top:1px solid var(--line)}.btn{border:none;border-radius:4px;padding:11px 18px;font-size:.9rem;font-family:var(--font-body)}.primary{background:var(--brass);color:#16130A;width:100%}.status{min-height:1em;text-align:center;font-size:.75rem;color:var(--teal);margin-top:8px}.empty{text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:.75rem;padding:30px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="index.html">‹ Applicants</a><h1>Recruiting Events</h1><span></span></div>
  <div id="listView">
    <button class="add" id="addEvent">+ New recruiting event</button>
    <div id="eventList"><div class="empty">Loading events…</div></div>
  </div>
  <div id="editView" class="hidden">
    <button class="back" id="backList" type="button">‹ Back to events</button>
    <div class="mode-note hidden" id="modeNote"></div>
    <div class="section-title">Event</div>
    <label for="eventName">Event name</label><input id="eventName" type="text" placeholder="Minico Career Fair">
    <div class="field-row"><div><label for="eventDate">Date</label><input id="eventDate" type="date"></div><div id="typeWrap"><label for="eventType">Type</label><select id="eventType"><option>School Visit</option><option>Career Fair</option><option>Community Event</option><option>Presentation</option><option>Meeting</option><option>Other</option></select></div></div>
    <label for="eventLocation">Location</label><input id="eventLocation" type="text" placeholder="Minico High School">
    <div id="recruitingFields">
      <label for="eventPoc">POC</label><input id="eventPoc" type="text" placeholder="Name / organization">
      <label for="eventNotes">Planning notes</label><textarea id="eventNotes" placeholder="Setup, materials, audience, follow-up…"></textarea>
    </div>

    <div class="section-title">Results</div>
    <div class="field-row"><div><label for="eventLeads">Leads</label><input id="eventLeads" type="number" min="0" value="0"></div><div><label for="eventAppointments">Appointments</label><input id="eventAppointments" type="number" min="0" value="0"></div></div>
    <div class="field-row"><div><label for="eventQualified">Qualified</label><input id="eventQualified" type="number" min="0" value="0"></div><div><label for="eventContracts">Contracts</label><input id="eventContracts" type="number" min="0" value="0"></div></div>
    <label for="eventResultNotes">Result notes</label><textarea id="eventResultNotes" placeholder="What worked, follow-up required, lessons learned…"></textarea>
    <button class="btn primary" id="saveEvent" type="button">Save event</button><div class="status" id="saveStatus"></div>
  </div>
</div>
<script type="module">
import{db,auth,collection,doc,addDoc,updateDoc,setDoc,onSnapshot,query,orderBy,serverTimestamp,onAuthStateChanged}from'./firebase-config.js';
import{escapeHtml,parseDateOnly,parseICS,calendarEventKey,toDateInput}from'./pibase-util.js';
let events=[],calendarEvents=[],resultsByKey={},eventsStatus='loading',calendarStatus='loading',currentId=null,currentCalKey=null,unsub=null,unsubResults=null;const listView=document.getElementById('listView'),editView=document.getElementById('editView');
const el=id=>document.getElementById(id);const esc=escapeHtml;const parseDate=parseDateOnly;const num=v=>Math.max(0,Number(v)||0);
function eventState(e){const d=parseDate(e.date),today=new Date();today.setHours(0,0,0,0);if(!d)return'';if(d<today)return'Past';if(d.getTime()===today.getTime())return'Today';return'Upcoming'}
function calendarState(start){const day=new Date(start);day.setHours(0,0,0,0);const today=new Date();today.setHours(0,0,0,0);if(day<today)return'Past';if(day.getTime()===today.getTime())return'Today';return'Upcoming'}
function calendarMeta(e){const allDay=e.start.getHours()===0&&e.start.getMinutes()===0&&(!e.end||e.end-e.start>=86400000),date=e.start.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),time=allDay?'All day':e.start.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});return`${date} · ${time}${e.location?' · '+e.location:''}`}
function hasResults(r){return!!r&&(num(r.leads)+num(r.appointments)+num(r.qualified)+num(r.contracts)>0||(r.resultNotes||'').trim())}
function resultRow(r){return`<div class="results"><span>${num(r.leads)} leads</span><span>${num(r.appointments)} appts</span><span>${num(r.qualified)} qualified</span><span>${num(r.contracts)} contracts</span></div>`}
function calendarCard(e){const key=calendarEventKey(e),r=resultsByKey[key],has=hasResults(r);return`<div class="event-card synced" data-cal-key="${esc(key)}"><div class="event-row"><div><div class="event-name">${esc(e.summary)}</div><div class="event-meta">${esc(calendarMeta(e))}</div></div><div class="event-type">${esc(calendarState(e.start))}<br>iCloud</div></div>${has?resultRow(r):''}<div class="event-action">${has?'Edit results':'Report results'} ›</div></div>`}
function recruitingCard(e){const has=hasResults(e);return`<div class="event-card" data-id="${esc(e.id)}"><div class="event-row"><div><div class="event-name">${esc(e.name||'Unnamed event')}</div><div class="event-meta">${esc(e.date||'No date')}${e.location?' · '+esc(e.location):''}</div></div><div class="event-type">${esc(eventState(e))} · ${esc(e.type||'Event')}</div></div>${has?resultRow(e):''}</div>`}
function render(){
  const today=new Date();today.setHours(0,0,0,0);const cutoff=new Date(today);cutoff.setDate(cutoff.getDate()-30);
  const upcoming=calendarEvents.filter(e=>e.start>=today).sort((a,b)=>a.start-b.start);
  const recent=calendarEvents.filter(e=>e.start<today&&(e.start>=cutoff||hasResults(resultsByKey[calendarEventKey(e)]))).sort((a,b)=>b.start-a.start);
  const tracked=[...events].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let html=`<div class="event-source">Apple Calendar <span>${calendarStatus==='ready'?`${upcoming.length} upcoming${recent.length?` · ${recent.length} recent`:''}`:calendarStatus==='error'?'sync unavailable':'syncing…'}</span></div>`;
  if(calendarStatus==='loading')html+='<div class="source-message">Loading Apple Calendar…</div>';
  else if(calendarStatus==='error')html+='<div class="source-message">Apple Calendar could not be loaded. Pull down to refresh or try again shortly.</div>';
  else{html+=upcoming.length?upcoming.map(calendarCard).join(''):'<div class="source-message">No upcoming Apple Calendar events.</div>';if(recent.length){html+=`<div class="event-source">Apple Calendar · Recent <span>${recent.length}</span></div>`;html+=recent.map(calendarCard).join('');}}
  html+=`<div class="event-source">Recruiting Event Records <span>${eventsStatus==='ready'?tracked.length:eventsStatus==='error'?'unavailable':'loading…'}</span></div>`;
  if(eventsStatus==='loading')html+='<div class="source-message">Loading recruiting event records…</div>';
  else if(eventsStatus==='error')html+='<div class="source-message">Recruiting event records could not be loaded.</div>';
  else html+=tracked.length?tracked.map(recruitingCard).join(''):'<div class="source-message">No recruiting event records yet. Use the button above to add one.</div>';
  el('eventList').innerHTML=html;
  document.querySelectorAll('.event-card[data-id]').forEach(c=>c.addEventListener('click',()=>open(c.dataset.id)));
  document.querySelectorAll('.event-card[data-cal-key]').forEach(c=>c.addEventListener('click',()=>openCalendar(c.dataset.calKey)));
}
async function loadCalendarFeed(){calendarStatus='loading';render();try{const res=await fetch(`./calendar.ics?v=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);calendarEvents=parseICS(await res.text());calendarStatus='ready'}catch(err){console.error('Apple Calendar sync failed',err);calendarStatus='error'}render()}
function open(id){currentId=id;currentCalKey=null;const e=id?events.find(x=>x.id===id):{};['Name','Date','Location','Poc','Notes','ResultNotes'].forEach(k=>el('event'+k).value=e?.[k.charAt(0).toLowerCase()+k.slice(1)]||'');el('eventType').value=e?.type||'School Visit';['Leads','Appointments','Qualified','Contracts'].forEach(k=>el('event'+k).value=Number(e?.[k.toLowerCase()]||0));setFormMode('recruiting');listView.classList.add('hidden');editView.classList.remove('hidden');el('saveStatus').textContent=''}
function openCalendar(key){const e=calendarEvents.find(x=>calendarEventKey(x)===key);if(!e)return;currentId=null;currentCalKey=key;const r=resultsByKey[key]||{};el('eventName').value=e.summary;el('eventDate').value=toDateInput(e.start);el('eventLocation').value=e.location||'';['Leads','Appointments','Qualified','Contracts'].forEach(k=>el('event'+k).value=num(r[k.toLowerCase()]));el('eventResultNotes').value=r.resultNotes||'';setFormMode('calendar');listView.classList.add('hidden');editView.classList.remove('hidden');el('saveStatus').textContent=''}
function setFormMode(mode){const isCal=mode==='calendar';el('eventName').readOnly=isCal;el('eventDate').readOnly=isCal;el('eventLocation').readOnly=isCal;el('typeWrap').classList.toggle('hidden',isCal);el('recruitingFields').classList.toggle('hidden',isCal);el('modeNote').classList.toggle('hidden',!isCal);el('modeNote').textContent=isCal?'iCloud calendar event — enter results only.':'';
el('saveEvent').textContent=isCal?'Save results':'Save event'}
function close(){currentId=null;currentCalKey=null;setFormMode('recruiting');editView.classList.add('hidden');listView.classList.remove('hidden')}
el('addEvent').addEventListener('click',()=>open(null));el('backList').addEventListener('click',close);
el('saveEvent').addEventListener('click',async()=>{const status=el('saveStatus'),numbers={leads:num(el('eventLeads').value),appointments:num(el('eventAppointments').value),qualified:num(el('eventQualified').value),contracts:num(el('eventContracts').value)},resultNotes=el('eventResultNotes').value.trim();if(currentCalKey){const e=calendarEvents.find(x=>calendarEventKey(x)===currentCalKey);if(!e)return;const payload={summary:e.summary,location:e.location||'',start:toDateInput(e.start),uid:e.uid||'',...numbers,resultNotes,updatedAt:serverTimestamp()};if(!resultsByKey[currentCalKey])payload.createdAt=serverTimestamp();status.textContent='Saving…';try{await setDoc(doc(db,'eventResults',currentCalKey),payload,{merge:true});status.style.color='';status.textContent='Saved.';setTimeout(close,700)}catch(err){console.error(err);status.style.color='#E08B77';status.textContent='Save failed.'}return}const payload={name:el('eventName').value.trim(),date:el('eventDate').value,type:el('eventType').value,location:el('eventLocation').value.trim(),poc:el('eventPoc').value.trim(),notes:el('eventNotes').value.trim(),...numbers,resultNotes,updatedAt:serverTimestamp()};if(!payload.name||!payload.date){status.style.color='#E08B77';status.textContent='Event name and date are required.';return}status.textContent='Saving…';try{if(currentId)await updateDoc(doc(db,'events',currentId),payload);else{payload.createdAt=serverTimestamp();const ref=await addDoc(collection(db,'events'),payload);currentId=ref.id}status.style.color='';status.textContent='Saved.';setTimeout(close,700)}catch(err){console.error(err);status.style.color='#E08B77';status.textContent='Save failed.'}});
onAuthStateChanged(auth,user=>{if(!user){window.location.href='index.html';return}if(unsub)unsub();unsub=onSnapshot(query(collection(db,'events'),orderBy('date','asc')),snap=>{events=snap.docs.map(d=>({id:d.id,...d.data()}));eventsStatus='ready';render()},err=>{console.error(err);eventsStatus='error';render()});if(unsubResults)unsubResults();unsubResults=onSnapshot(collection(db,'eventResults'),snap=>{resultsByKey={};snap.docs.forEach(d=>{resultsByKey[d.id]=d.data()});render()},err=>{console.error(err);render()})});
loadCalendarFeed();
setInterval(loadCalendarFeed,5*60*1000);
</script>
<script type="module" src="./pwa-runtime.js"></script>
</body>
</html>
