<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APPLEMDT — Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  .board {
    height: 100vh;
    box-sizing: border-box;
    padding: 12px 22px 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .verse-banner {
    flex: 0 0 auto;
    font-family: var(--font-mono);
    color: var(--text-dim);
    font-size: 0.7rem;
    text-align: center;
    margin: 0 auto 7px;
    max-width: 900px;
    line-height: 1.25;
  }

  .board-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--brass-dim);
  }
  .board-header .titles {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .board-header .seal {
    width: 40px;
    height: 40px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .board-header h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--text);
    line-height: 1;
  }
  .board-header .eyebrow {
    font-size: 0.58rem;
    margin-bottom: 2px;
  }
  .board-header .count {
    font-family: var(--font-mono);
    color: var(--text-muted);
    font-size: 0.8rem;
  }
  .clock {
    font-family: var(--font-mono);
    color: var(--text-dim);
    font-size: 0.7rem;
  }

  .grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(4, minmax(0, 1fr));
    gap: 7px;
    overflow: hidden;
  }

  .card {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
    box-sizing: border-box;
  }
  .card.flagged { border-color: var(--rust-dim); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px;
    margin-bottom: 1px;
  }
  .card-top .name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-display);
    font-size: 0.95rem;
    line-height: 1.05;
    font-weight: 500;
    color: var(--text);
  }
  .badges {
    display: flex;
    gap: 3px;
    flex-shrink: 0;
  }
  .badge {
    font-size: 0.54rem;
    padding: 2px 4px;
  }

  .meta-line {
    min-height: 0.8rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--text-dim);
    margin-bottom: 3px;
    letter-spacing: 0.01em;
  }

  .card .stage-rail { margin: 2px 0 1px; }
  .card .stage-rail .label { font-size: 0.46rem; }
  .card .stage-rail .dot {
    width: 7px;
    height: 7px;
  }

  .latest-note {
    font-size: 0.62rem;
    color: var(--text-muted);
    border-top: 1px solid var(--line);
    padding-top: 3px;
    margin-top: 1px;
    line-height: 1.15;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .latest-note .note-label {
    font-family: var(--font-mono);
    font-size: 0.48rem;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 1px;
  }

  .empty-state {
    color: var(--text-dim);
    font-family: var(--font-mono);
    text-align: center;
    padding: 40px 20px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="board">
  <div class="verse-banner">"So I prophesied as he commanded me, and the breath came into them, and they lived and stood on their feet, an exceedingly great army." — Ezekiel 37:10 ESV</div>
  <div class="board-header">
    <div class="titles">
      <img src="angrr-seal.png" alt="Army National Guard Recruiting and Retention" class="seal">
      <div>
        <div class="eyebrow">APPLEMDT</div>
        <h1>Applicant Board</h1>
      </div>
    </div>
    <div style="text-align:right;">
      <div class="count" id="count">— applicants</div>
      <div class="clock" id="clock"></div>
    </div>
  </div>

  <div class="grid" id="grid">
    <div class="empty-state">Loading board…</div>
  </div>
</div>

<script type="module">
  import { db, collection, onSnapshot, query, orderBy, STAGES, STAGE_SHORT, needsReview }
    from './firebase-config.js';

  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clockEl = document.getElementById('clock');

  function tickClock() {
    const now = new Date();
    clockEl.textContent = now.toLocaleString('en-US', {
      weekday: 'short', month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
  }
  tickClock();
  setInterval(tickClock, 30000);

  function renderStageRail(currentStage) {
    const currentIdx = STAGES.indexOf(currentStage);
    return `<div class="stage-rail">` + STAGES.map((stage, i) => {
      let cls = '';
      if (i < currentIdx) cls = 'done';
      else if (i === currentIdx) cls = 'current';
      return `
        <div class="node-wrap ${cls}">
          <div class="track"></div>
          <div class="dot"></div>
          <div class="label">${STAGE_SHORT[stage]}</div>
        </div>`;
    }).join('') + `</div>`;
  }

  function renderCard(applicant) {
    const flagged = needsReview(applicant);
    const badges = [];
    if (flagged) badges.push(`<span class="badge flag">Review</span>`);
    if (applicant.statusStage === 'Waiver' && applicant.waiverType) {
      badges.push(`<span class="badge waiver">${applicant.waiverType}</span>`);
    }

    const meta = [
      applicant.age ? `${applicant.age} yo` : null,
      applicant.priorService || null,
      applicant.educationLevel || null
    ].filter(Boolean).join('  ·  ');

    const note = applicant.latestNote
      ? `<div class="latest-note"><span class="note-label">Latest note</span>${escapeHtml(applicant.latestNote)}</div>`
      : '';

    return `
      <div class="card ${flagged ? 'flagged' : ''}">
        <div class="card-top">
          <div class="name">${escapeHtml(applicant.name || 'Unnamed')}</div>
          <div class="badges">${badges.join('')}</div>
        </div>
        <div class="meta-line">${meta}</div>
        ${renderStageRail(applicant.statusStage || STAGES[0])}
        ${note}
      </div>`;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  const q = query(collection(db, 'applicants'), orderBy('updatedAt', 'desc'));
  onSnapshot(q, (snapshot) => {
    if (snapshot.empty) {
      grid.innerHTML = `<div class="empty-state">No applicants yet</div>`;
      countEl.textContent = '0 applicants';
      return;
    }
    const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    countEl.textContent = `${docs.length} applicant${docs.length === 1 ? '' : 's'}`;
    grid.innerHTML = docs.map(renderCard).join('');
  }, (err) => {
    grid.innerHTML = `<div class="empty-state">Connection error — check MiFi / network</div>`;
    console.error(err);
  });
</script>

</body>
</html>
