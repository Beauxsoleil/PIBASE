name: Sync iCloud Calendar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-calendar.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install calendar parser
        run: python3 -m pip install --disable-pip-version-check 'icalendar>=6,<7' 'recurring-ical-events>=3,<4'

      - name: Fetch, expand, and slim published iCloud calendar
        shell: bash
        run: |
          set -euo pipefail
          CALENDAR_URL='https://p158-caldav.icloud.com/published/2/ODEzNzc2MzQ5ODEzNzc2M7dOWSENm8pADV3MQ_WsD963YRXzTCInAwMYiWPaL99qSEwKJrZPtb9TXTH_7CrrWf0IO-zFh1HNQP2FQ3pBbCQ'
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            -H 'User-Agent: PIBASE-Calendar-Sync/1.0' \
            "$CALENDAR_URL" -o calendar.full.ics

          grep -q 'BEGIN:VCALENDAR' calendar.full.ics

          # Expand RRULE/RDATE/EXDATE/RECURRENCE-ID on GitHub's runner. The Pi
          # receives only flattened event instances and four display fields.
          python3 - <<'PY'
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import icalendar
          import recurring_ical_events

          source = Path('calendar.full.ics').read_bytes()
          calendar = icalendar.Calendar.from_ical(source)

          now = datetime.now(timezone.utc)
          low = now - timedelta(days=90)
          high = now + timedelta(days=370)
          instances = recurring_ical_events.of(calendar).between(low, high)
          boise = ZoneInfo('America/Boise')

          def clean_text(value):
              text = str(value or '')
              return (text.replace('\\', '\\\\')
                          .replace('\r\n', '\\n')
                          .replace('\n', '\\n')
                          .replace(',', '\\,')
                          .replace(';', '\\;'))

          def date_line(name, value):
              if isinstance(value, datetime):
                  if value.tzinfo is None:
                      local = value
                  else:
                      local = value.astimezone(boise).replace(tzinfo=None)
                  return f'{name};TZID=America/Boise:{local:%Y%m%dT%H%M%S}'
              if isinstance(value, date):
                  return f'{name};VALUE=DATE:{value:%Y%m%d}'
              return None

          def decoded(component, key):
              try:
                  return component.decoded(key)
              except Exception:
                  return None

          rows = []
          for event in instances:
              start = decoded(event, 'DTSTART')
              if start is None:
                  continue
              end = decoded(event, 'DTEND')
              if end is None:
                  duration = decoded(event, 'DURATION')
                  if duration is not None:
                      end = start + duration
                  elif isinstance(start, datetime):
                      end = start + timedelta(hours=1)
                  else:
                      end = start + timedelta(days=1)

              summary = clean_text(event.get('SUMMARY', 'Untitled event'))
              location = clean_text(event.get('LOCATION', ''))
              start_line = date_line('DTSTART', start)
              end_line = date_line('DTEND', end)
              if not start_line:
                  continue

              lines = ['BEGIN:VEVENT', start_line]
              if end_line:
                  lines.append(end_line)
              lines.append(f'SUMMARY:{summary}')
              if location:
                  lines.append(f'LOCATION:{location}')
              lines.append('END:VEVENT')
              rows.append((start, lines))

          def sort_key(item):
              value = item[0]
              if isinstance(value, datetime):
                  if value.tzinfo is None:
                      return value.replace(tzinfo=boise).astimezone(timezone.utc)
                  return value.astimezone(timezone.utc)
              return datetime(value.year, value.month, value.day, tzinfo=boise).astimezone(timezone.utc)

          rows.sort(key=sort_key)
          out = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//PIBASE//Calendar Kiosk//EN']
          for _, lines in rows:
              out.extend(lines)
          out.append('END:VCALENDAR')
          Path('calendar.ics.tmp').write_text('\r\n'.join(out) + '\r\n', encoding='utf-8')
          print(f'Published {len(rows)} flattened calendar event instances.')
          PY

          rm -f calendar.full.ics
          mv calendar.ics.tmp calendar.ics

      - name: Publish updated calendar
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- calendar.ics && git ls-files --error-unmatch calendar.ics >/dev/null 2>&1; then
            echo 'Calendar is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendar.ics
          git commit -m 'Sync iCloud calendar'
          git push
