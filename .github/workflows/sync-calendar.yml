name: Sync iCloud Calendar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-calendar.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and slim published iCloud calendar
        shell: bash
        run: |
          set -euo pipefail
          CALENDAR_URL='https://p158-caldav.icloud.com/published/2/ODEzNzc2MzQ5ODEzNzc2M7dOWSENm8pADV3MQ_WsD963YRXzTCInAwMYiWPaL99qSEwKJrZPtb9TXTH_7CrrWf0IO-zFh1HNQP2FQ3pBbCQ'
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            -H 'User-Agent: PIBASE-Calendar-Sync/1.0' \
            "$CALENDAR_URL" -o calendar.full.ics

          grep -q 'BEGIN:VCALENDAR' calendar.full.ics

          # The Pi kiosk only reads DTSTART, DTEND, SUMMARY and LOCATION.
          # Strip Apple attachment/map metadata and old history before the file
          # ever reaches the Pi. Keep 90 days behind and 370 days ahead so the
          # weekly calendar can still be browsed meaningfully.
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import re

          raw = Path('calendar.full.ics').read_text(encoding='utf-8', errors='replace')
          logical = re.sub(r'\r?\n[ \t]', '', raw).splitlines()

          events = []
          current = None
          for line in logical:
              if line == 'BEGIN:VEVENT':
                  current = []
              elif line == 'END:VEVENT':
                  if current is not None:
                      events.append(current)
                  current = None
              elif current is not None:
                  current.append(line)

          now = datetime.now(timezone.utc).replace(tzinfo=None)
          low = now - timedelta(days=90)
          high = now + timedelta(days=370)
          keep_names = ('DTSTART', 'DTEND', 'SUMMARY', 'LOCATION')
          out = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//PIBASE//Calendar Kiosk//EN']

          def start_date(lines):
              for line in lines:
                  if line.startswith('DTSTART') and ':' in line:
                      value = line.split(':', 1)[1].strip()
                      match = re.match(r'(\d{8})(?:T(\d{6}))?', value)
                      if not match:
                          return None
                      fmt = '%Y%m%d%H%M%S' if match.group(2) else '%Y%m%d'
                      text = match.group(1) + (match.group(2) or '')
                      try:
                          return datetime.strptime(text, fmt)
                      except ValueError:
                          return None
              return None

          for lines in events:
              start = start_date(lines)
              if start is None or start < low or start > high:
                  continue
              out.append('BEGIN:VEVENT')
              for line in lines:
                  name = line.split(';', 1)[0].split(':', 1)[0]
                  if name in keep_names:
                      out.append(line)
              out.append('END:VEVENT')

          out.append('END:VCALENDAR')
          Path('calendar.ics.tmp').write_text('\r\n'.join(out) + '\r\n', encoding='utf-8')
          PY

          rm -f calendar.full.ics
          mv calendar.ics.tmp calendar.ics

      - name: Publish updated calendar
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- calendar.ics && git ls-files --error-unmatch calendar.ics >/dev/null 2>&1; then
            echo 'Calendar is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendar.ics
          git commit -m 'Sync iCloud calendar'
          git push
