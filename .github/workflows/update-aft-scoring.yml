name: Build official AFT scoring data

on:
  workflow_dispatch:
  push:
    branches:
      - feature/sfs-aft-enlistment
    paths:
      - scripts/build-aft-scoring.py
      - .github/workflows/update-aft-scoring.yml

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[aft-data]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tables from official Army PDF
        run: |
          python -m pip install --quiet beautifulsoup4==4.12.3
          python scripts/build-aft-scoring.py aft-scoring-data.json
      - name: Commit verified scoring data
        run: |
          if git diff --quiet -- aft-scoring-data.json && git ls-files --error-unmatch aft-scoring-data.json >/dev/null 2>&1; then
            echo "Scoring data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aft-scoring-data.json
          git commit -m "Update official AFT scoring tables [aft-data]"
          git push origin HEAD:${{ github.ref_name }}
