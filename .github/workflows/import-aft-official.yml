name: One-time import official AFT scoring data

on:
  push:
    branches:
      - feature/sfs-aft-enlistment
    paths:
      - .github/workflows/import-aft-official.yml

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message || '', '[official-aft-imported]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sfs-aft-enlistment
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build complete scoring table from official GoArmy PDF
        run: |
          python -m pip install --quiet pdfplumber==0.11.4
          python scripts/build-aft-scoring.py aft-scoring-data.json
          python - <<'PY'
          import json
          d=json.load(open('aft-scoring-data.json'))
          assert d['version']=='250601'
          assert 'goarmy.com' in d['provenance']['officialSource']
          for e in ['MDL','HRP','SDC','PLK','2MR']:
              assert e in d['events']
          # Exact intermediate points prove this is not the earlier abbreviated table.
          rows=dict(d['events']['SDC']['columns']['22-26']['M'])
          assert rows[99]=='1:32'
          assert rows[98]=='1:33'
          rows2=dict(d['events']['2MR']['columns']['22-26']['M'])
          assert rows2[99]=='13:47'
          assert rows2[98]=='13:55'
          print('Official AFT completeness gate passed')
          PY
      - name: Commit data and remove one-time importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aft-scoring-data.json
          git rm .github/workflows/import-aft-official.yml
          git commit -m "Bundle complete official AFT scoring data [official-aft-imported]"
          git push origin HEAD:feature/sfs-aft-enlistment
